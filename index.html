<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="dark light">
  <title>LibDB テスト</title>
  <style>
    :root {
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color-scheme: dark;
      background: #101318;
      color: #edf0f5;
    }
    body {
      max-width: 760px;
      margin: 0 auto;
      padding: 32px 20px 56px;
    }
    h1 { margin-bottom: 8px; }
    p { color: #aeb7c4; line-height: 1.7; }
    .panel {
      margin-top: 24px;
      padding: 20px;
      border: 1px solid #303846;
      border-radius: 14px;
      background: #191f28;
    }
    button {
      padding: 10px 16px;
      border: 0;
      border-radius: 8px;
      background: #7c9cff;
      color: #101318;
      font: inherit;
      font-weight: 700;
      cursor: pointer;
    }
    button:disabled { opacity: .55; cursor: wait; }
    input {
      min-width: 0;
      flex: 1;
      padding: 10px 12px;
      border: 1px solid #465267;
      border-radius: 8px;
      background: #0b0e12;
      color: inherit;
      font: inherit;
    }
    .form-row, .db-row, .actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .db-list { display: grid; gap: 10px; margin-top: 16px; }
    .db-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      padding: 12px;
      border: 1px solid #303846;
      border-radius: 10px;
      background: #111720;
    }
    .db-meta { min-width: 0; overflow-wrap: anywhere; }
    .db-meta strong { display: block; }
    .db-meta small { color: #aeb7c4; }
    button.secondary { background: #354256; color: #edf0f5; }
    button.danger { background: #a94755; color: white; }
    #status { margin: 16px 0 0; font-weight: 700; }
    #log {
      min-height: 180px;
      margin: 12px 0 0;
      padding: 14px;
      overflow-wrap: anywhere;
      white-space: pre-wrap;
      border-radius: 8px;
      background: #0b0e12;
      color: #d4deed;
      font: 13px/1.7 ui-monospace, SFMono-Regular, Consolas, monospace;
    }
    code { color: #b9ccff; }
  </style>
</head>
<body>
  <h1>LibDB テスト</h1>
  <p>
    GitHub Pages 経由で <code>src/index.js</code> を読み込み、
    LibDB の基本操作・一括操作・インデックス・複数ストアトランザクション・DB削除を確認します。
  </p>

  <section class="panel">
    <h2>データベース管理</h2>
    <p>デモ用のデータベースを追加したり、接続・削除したりできます。</p>
    <form id="add-db-form" class="form-row">
      <input id="db-name" name="name" placeholder="データベース名" maxlength="80" required>
      <button type="submit">Databaseを追加</button>
    </form>
    <div id="db-list" class="db-list" aria-live="polite"></div>
    <p id="db-status" role="status" aria-live="polite">一覧を読み込み中...</p>
  </section>

  <section class="panel">
    <h2>ライブラリテスト</h2>
    <button id="run" type="button">テストを実行</button>
    <p id="status" role="status" aria-live="polite">読み込み中...</p>
    <pre id="log" aria-live="polite"></pre>
  </section>

  <script type="module">
    import { LibDB, LibDBError } from
      "https://ysas4331.github.io/LibDB/src/index.js?v=20261122-4";

    // DevTools のコンソールからも使えるようにグローバルへ公開
    Object.assign(globalThis, { LibDB, LibDBError });

    const openDatabases = new Map();
    const dbList = document.querySelector("#db-list");
    const dbStatus = document.querySelector("#db-status");
    const addDbForm = document.querySelector("#add-db-form");

    async function refreshDatabases() {
      if (typeof indexedDB.databases !== "function") {
        dbStatus.textContent = "このブラウザはデータベース一覧取得に対応していません。";
        return;
      }

      try {
        const databases = (await indexedDB.databases())
          .filter((item) => item.name)
          .sort((a, b) => a.name.localeCompare(b.name));
        dbList.replaceChildren();

        if (databases.length === 0) {
          dbList.textContent = "データベースはありません。";
        }

        for (const item of databases) {
          const row = document.createElement("div");
          row.className = "db-item";

          const meta = document.createElement("div");
          meta.className = "db-meta";
          const title = document.createElement("strong");
          title.textContent = item.name;
          const detail = document.createElement("small");
          detail.textContent = "Version " + (item.version ?? "不明") +
            (openDatabases.has(item.name) ? " ・このページで接続中" : "");
          meta.append(title, detail);

          const actions = document.createElement("div");
          actions.className = "actions";
          const connect = document.createElement("button");
          connect.className = "secondary";
          connect.textContent = openDatabases.has(item.name) ? "接続済み" : "接続";
          connect.disabled = openDatabases.has(item.name);
          connect.addEventListener("click", async () => {
            try {
              const connection = new LibDB(item.name);
              await connection.ready;
              openDatabases.set(item.name, connection);
              dbStatus.textContent = item.name + " に接続しました。";
              await refreshDatabases();
            } catch (error) {
              dbStatus.textContent = "接続失敗: " + error.message;
            }
          });

          const remove = document.createElement("button");
          remove.className = "danger";
          remove.textContent = "削除";
          remove.addEventListener("click", async () => {
            if (!confirm("「" + item.name + "」を削除しますか？\n保存されているデータもすべて削除されます。")) return;
            remove.disabled = true;
            try {
              await LibDB.delete(item.name);
              openDatabases.delete(item.name);
              dbStatus.textContent = item.name + " を削除しました。";
              await refreshDatabases();
            } catch (error) {
              dbStatus.textContent = "削除失敗: " + error.message;
              remove.disabled = false;
            }
          });

          actions.append(connect, remove);
          row.append(meta, actions);
          dbList.append(row);
        }

        dbStatus.textContent = databases.length + " 件のデータベース";
      } catch (error) {
        dbStatus.textContent = "一覧取得失敗: " + error.message;
      }
    }

    addDbForm.addEventListener("submit", async (event) => {
      event.preventDefault();
      const input = document.querySelector("#db-name");
      const name = input.value.trim();
      if (!name) return;

      try {
        const existing = (await indexedDB.databases()).some((item) => item.name === name);
        if (existing) {
          dbStatus.textContent = "同じ名前のデータベースが既にあります。";
          return;
        }

        const connection = new LibDB(name, 1, {
          demo: { keyPath: "id", autoIncrement: true }
        });
        await connection.ready;
        openDatabases.set(name, connection);
        input.value = "";
        dbStatus.textContent = name + " を追加しました。demoストアを作成しました。";
        await refreshDatabases();
      } catch (error) {
        dbStatus.textContent = "追加失敗: " + error.message;
      }
    });

    await refreshDatabases();

    const runButton = document.querySelector("#run");
    const status = document.querySelector("#status");
    const log = document.querySelector("#log");

    function write(message) {
      log.textContent += message + "\n";
    }

    function assert(condition, message) {
      if (!condition) throw new Error(message);
      write("✓ " + message);
    }

    async function runTests() {
      runButton.disabled = true;
      log.textContent = "";
      status.textContent = "テスト実行中...";

      const dbName = "LibDB-Test-" + Date.now();
      let db;

      try {
        db = new LibDB(dbName, 1, {
          records: {
            keyPath: "id",
            autoIncrement: true,
            indexes: [
              { name: "byName", keyPath: "name" }
            ]
          },
          external: {},
          logs: {
            keyPath: "id",
            autoIncrement: true
          }
        });
        await db.ready;
        assert(true, "データベース接続");

        const records = db.store("records");

        const firstKey = await records.add({
          name: "Alice",
          score: 100
        });
        await records.add({
          name: "Bob",
          score: 80
        });
        assert(firstKey === 1, "add() / autoIncrement");

        const one = await records.get(1);
        assert(one?.name === "Alice", "get()");

        const all = await records.getAll();
        assert(all.length === 2, "getAll()");

        const keys = await records.getAllKeys();
        assert(keys.length === 2 && keys.includes(1) && keys.includes(2), "getAllKeys()");

        const total = await records.count();
        assert(total === 2, "count()");

        const byName = records.index("byName");
        const alice = await byName.get("Alice");
        const named = await byName.getAll("Alice");
        const namedCount = await byName.count("Alice");
        assert(alice?.name === "Alice" && named.length === 1 && namedCount === 1, "index().get() / getAll() / count()");

        await records.put({
          id: 1,
          name: "Alice",
          score: 120
        });
        const updated = await records.get(1);
        assert(updated.score === 120, "put()");

        await records.bulkAdd([
          { name: "Carol", score: 70 },
          { name: "Dave", score: 60 }
        ]);
        assert(await records.count() === 4, "bulkAdd()");

        await records.bulkPut([
          { id: 1, name: "Alice", score: 130 },
          { id: 2, name: "Bob", score: 90 }
        ]);
        assert((await records.get(1)).score === 130, "bulkPut()");

        await records.bulkDelete([3, 4]);
        assert(await records.count() === 2, "bulkDelete()");

        const external = db.store("external");
        const externalKey = await external.add({ value: "first" }, "custom-key");
        await external.put({ value: "updated" }, "custom-key");
        assert(externalKey === "custom-key" && (await external.get("custom-key")).value === "updated", "add(value, key) / put(value, key)");

        await db.transaction(["records", "logs"], "readwrite", (stores) => {
          stores.records.put({ id: 10, name: "Transaction", score: 1 });
          stores.logs.add({ message: "transaction completed" });
        });
        assert((await records.get(10))?.name === "Transaction" && await db.store("logs").count() === 1, "db.transaction()");

        await records.delete(2);
        assert(await records.count() === 2, "delete()");

        await records.clear();
        assert(await records.count() === 0, "clear()");

        db.close();
        assert(true, "close()");

        const reconnected = await records.count();
        assert(reconnected === 0, "close() 後の自動再接続");

        try {
          await db.store("missing").get(1);
          throw new Error("存在しないストアのエラーが発生しませんでした");
        } catch (error) {
          assert(error instanceof LibDBError, "操作エラーの LibDBError 化");
        }

        status.textContent = "すべてのテストに成功しました";
        write("\nテスト完了");
      } catch (error) {
        status.textContent = "テスト失敗";
        write("✗ " + (error?.stack || error));
        console.error(error);
      } finally {
        db?.close();
        try {
          await LibDB.delete(dbName);
          write("LibDB.delete() でテスト用DBを削除しました");
        } catch (error) {
          write("DBの後片付けに失敗: " + error.message);
        }
        runButton.disabled = false;
      }
    }

    runButton.addEventListener("click", runTests);
    status.textContent = "ライブラリの読み込みに成功しました";
    write("GitHub Pages から LibDB を読み込みました。");
  </script>
</body>
</html>
